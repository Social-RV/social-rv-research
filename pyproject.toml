[project]
name = "social-rv-research"
version = "0.1.0"
description = "Tools for researching the Social RV remote viewing dataset"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.4.2",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]

[project.scripts]
social-rv-export = "social_rv_research.export:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/social_rv_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]
